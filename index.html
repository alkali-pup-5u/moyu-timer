<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">快樂摸魚🐟一齊吞pop</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f172a; }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-orange { box-shadow: 0 0 25px rgba(249, 115, 22, 0.25); }
        .glow-green { box-shadow: 0 0 25px rgba(34, 197, 94, 0.25); }
        @keyframes pop { 0% { transform: scale(1.7); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(-8deg); }
            25% { transform: translate(-4px, 2px) rotate(-12deg); }
            50% { transform: translate(4px, -2px) rotate(-4deg); }
            75% { transform: translate(-3px, -3px) rotate(-10deg); }
        }
        .rocket-pop { animation: pop .5s ease-out; }
        .rocket-shake { animation: shake .3s infinite; }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-orange-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 my-4">

        <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
            <div class="flex items-center gap-2 text-xs text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-orange-400"></i>
                <span id="today-date">載入中...</span>
            </div>
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 text-xs bg-slate-800 text-slate-300 pl-2.5 pr-1 py-1 rounded-full border border-slate-700">
                    <i data-lucide="languages" class="w-3.5 h-3.5 text-orange-400"></i>
                    <select id="lang-select" onchange="setLanguage(this.value)" class="bg-transparent outline-none cursor-pointer text-xs py-0.5">
                        <option class="bg-slate-900" value="cn">简体·内地</option>
                        <option class="bg-slate-900" value="zh">繁體·香港</option>
                        <option class="bg-slate-900" value="tw">繁體·台灣</option>
                        <option class="bg-slate-900" value="en">English</option>
                    </select>
                </div>
                <button onclick="toggleDonateModal(true)" class="flex items-center gap-1.5 text-xs bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-3 py-1.5 rounded-full border border-amber-500/30 transition">
                    <i data-lucide="coffee" class="w-3.5 h-3.5"></i>
                    <span data-i18n="donate">贊助作者</span>
                </button>
            </div>
        </div>

        <div class="text-center mb-4">
            <h1 id="status-title" class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-yellow-400">
                ⚙️ 請先完成基本設置
            </h1>
        </div>

        <div class="grid grid-cols-3 gap-3 my-4">
            <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-3 text-center glow-orange">
                <div id="hours" class="text-3xl sm:text-4xl font-extrabold text-orange-400 font-mono-num">--</div>
                <div class="text-[10px] sm:text-xs text-slate-400 mt-1" data-i18n="hours">小時</div>
            </div>
            <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-3 text-center glow-orange">
                <div id="minutes" class="text-3xl sm:text-4xl font-extrabold text-amber-400 font-mono-num">--</div>
                <div class="text-[10px] sm:text-xs text-slate-400 mt-1" data-i18n="minutes">分鐘</div>
            </div>
            <div class="bg-slate-800/90 border border-slate-700/60 rounded-2xl p-3 text-center glow-orange">
                <div id="seconds" class="text-3xl sm:text-4xl font-extrabold text-yellow-400 font-mono-num">--</div>
                <div class="text-[10px] sm:text-xs text-slate-400 mt-1" data-i18n="seconds">秒</div>
            </div>
        </div>

        <div class="bg-gradient-to-br from-emerald-950/60 to-slate-900/90 border border-emerald-500/30 rounded-2xl p-5 mb-5 text-center relative overflow-hidden glow-green">
            <div class="text-xs font-medium text-emerald-400/90 flex items-center justify-center gap-1.5 mb-1">
                <i data-lucide="coins" class="w-4 h-4"></i>
                <span data-i18n="earned_title">今日已賺取薪資</span>
            </div>
            <div class="text-4xl sm:text-5xl font-black text-emerald-400 font-mono-num my-1 tracking-tight">
                <span id="currency-symbol">$</span><span id="earned-money">0.00</span>
            </div>
            <div class="text-[11px] text-emerald-300/70 font-mono-num mt-1">
                <span data-i18n="per_second">每秒進帳</span>：<span id="currency-symbol-sub">$</span><span id="per-second">0.0000</span>
            </div>
        </div>

        <div class="mb-5">
            <div class="flex justify-between text-xs text-slate-400 mb-2 font-medium">
                <span class="flex items-center gap-1"><i data-lucide="battery-charging" class="w-3.5 h-3.5 text-orange-400"></i> <span data-i18n="progress_title">今日打工進度</span></span>
                <span id="progress-percent" class="font-mono-num text-orange-400 font-bold">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-0.5 border border-slate-700/50">
                <div id="progress-fill" class="h-full bg-gradient-to-r from-orange-500 via-amber-400 to-yellow-400 rounded-full transition-all duration-500 ease-out w-0"></div>
            </div>
        </div>

        <button onclick="openShare()" class="w-full mb-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-orange-300 font-bold rounded-xl border border-orange-500/30 transition text-xs flex items-center justify-center gap-2 cursor-pointer"><i data-lucide="share-2" class="w-4 h-4"></i><span data-i18n="share_btn">分享下班進度</span></button>

        <div class="bg-slate-800/50 border border-slate-700/40 rounded-xl p-3.5 text-xs text-amber-300/90 flex items-start gap-2.5 mb-5">
            <i data-lucide="quote" class="w-4 h-4 text-amber-400 shrink-0 mt-0.5"></i>
            <span id="quote-text" class="leading-relaxed">載入中...</span>
        </div>

        <details id="settings-details" class="group bg-slate-800/60 border border-orange-500/50 rounded-2xl overflow-hidden transition mb-4" open>
            <summary class="flex items-center justify-between p-4 cursor-pointer text-xs font-bold text-orange-300 hover:text-white select-none bg-orange-500/10">
                <span class="flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-orange-400"></i>
                    <span data-i18n="settings_title">⚙️ 填寫您的薪資與時間設定</span>
                </span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 group-open:rotate-180 transition-transform"></i>
            </summary>

            <div class="p-4 space-y-3 text-xs border-t border-slate-700/30">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_currency">貨幣選擇</label>
                        <select id="currency" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 cursor-pointer">
                            <option value="$" data-i18n="cur_usd">美金 USD ($)</option>
                            <option value="¥" data-i18n="cur_rmb">人民幣 RMB (¥)</option>
                            <option value="HKD " data-i18n="cur_hkd">港幣 HKD (HK$)</option>
                            <option value="NT$ " data-i18n="cur_twd">新台幣 TWD (NT$)</option>
                            <option value="€" data-i18n="cur_eur">歐元 EUR (€)</option>
                            <option value="£" data-i18n="cur_gbp">英鎊 GBP (£)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_calc_type">計薪方式</label>
                        <select id="calc-type" onchange="toggleCalcType()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 cursor-pointer">
                            <option value="monthly" data-i18n="type_monthly">按月薪計算</option>
                            <option value="daily" data-i18n="type_daily">按日薪計算</option>
                        </select>
                    </div>
                </div>

                <div id="monthly-fields" class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_salary">月薪金額</label>
                        <input type="number" id="monthly-salary" data-i18n-ph="ph_salary" placeholder="例如: 25000" step="500" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_days">每月工作天數</label>
                        <input type="number" id="work-days" data-i18n-ph="ph_days" placeholder="例如: 22" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num">
                    </div>
                </div>

                <div id="daily-fields" class="grid grid-cols-1 gap-3 hidden">
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_daily_salary">日薪金額</label>
                        <input type="number" id="daily-salary" data-i18n-ph="ph_daily" placeholder="例如: 1200" step="50" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_lunch">午休時間 (分鐘)</label>
                        <input type="number" id="lunch-minutes" data-i18n-ph="ph_lunch" placeholder="例如: 60" step="15" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_lunch_start">午休開始時間</label>
                        <select id="lunch-start" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num cursor-pointer"></select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_start">上班時間</label>
                        <select id="start-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num cursor-pointer"></select>
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1" data-i18n="label_off">下班時間</label>
                        <select id="off-time" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 outline-none focus:border-orange-500 font-mono-num cursor-pointer"></select>
                    </div>
                </div>

                <label class="flex items-center gap-2 text-slate-400 cursor-pointer select-none">
                    <input type="checkbox" id="weekend-rest" class="accent-orange-500">
                    <span data-i18n="label_weekend">週末休息（不計薪）</span>
                </label>
            </div>
        </details>

        <button onclick="startCounting()" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-slate-950 font-black rounded-2xl shadow-lg shadow-orange-500/20 transition text-sm flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
            <span data-i18n="btn_start">保存設定並開始摸魚計時！</span>
        </button>

        <div class="text-xs text-slate-500 mt-4 mb-2 text-center" data-i18n="busy_btn">🕶️ 假裝很忙</div>
        <div class="grid grid-cols-2 gap-2">
            <button onclick="openBusy('update')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl border border-slate-700 transition text-xs cursor-pointer">🪟 Windows BSOD</button>
            <button onclick="openBusy('mail')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl border border-slate-700 transition text-xs cursor-pointer">📧 Outlook</button>
            <button onclick="openBusy('excel')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl border border-slate-700 transition text-xs cursor-pointer">📊 Excel</button>
            <button onclick="openBusy('code')" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl border border-slate-700 transition text-xs cursor-pointer">💻 Terminal</button>
        </div>
    </main>

    <!-- 贊助 Modal -->
    <div id="donate-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 max-w-xs w-full shadow-2xl text-center relative">
            <button onclick="toggleDonateModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-amber-400 mb-1" data-i18n="donate_title">☕ 請作者喝杯咖啡</h3>
            <p class="text-xs text-slate-400 mb-4" data-i18n="donate_desc">覺得好用？歡迎掃碼贊助支持！</p>

            <div class="flex bg-slate-800 p-1 rounded-xl mb-4 text-xs font-medium">
                <button onclick="switchDonateTab('wechat')" id="tab-wechat" class="flex-1 py-2 rounded-lg bg-emerald-600 text-white transition" data-i18n="tab_wechat">微信支付</button>
                <button onclick="switchDonateTab('alipay')" id="tab-alipay" class="flex-1 py-2 rounded-lg text-slate-400 transition" data-i18n="tab_alipay">支付寶</button>
            </div>

            <div class="bg-white p-3 rounded-2xl mb-4 inline-block shadow-inner">
                <img id="qr-wechat" src="wechat-qr.png" alt="請放置 wechat-qr.png" onerror="this.alt='請放置 wechat-qr.png'" class="w-48 h-48 object-contain mx-auto text-xs text-slate-500">
                <img id="qr-alipay" src="alipay-qr.png" alt="請放置 alipay-qr.png" onerror="this.alt='請放置 alipay-qr.png'" class="w-48 h-48 object-contain mx-auto hidden text-xs text-slate-500">
            </div>

            <p class="text-[10px] text-slate-500" data-i18n="donate_footer">感謝您的支持，讓摸魚更有動力！</p>
        </div>
    </div>

    <!-- 分享圖片 -->
    <div id="share-modal" onclick="toggleShare(false)" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4">
        <div onclick="event.stopPropagation()" class="bg-slate-900 border border-slate-700/80 rounded-3xl p-4 max-w-xs w-full shadow-2xl text-center max-h-[95vh] overflow-y-auto">
            <img id="share-img" alt="" class="w-full rounded-2xl mb-3 bg-slate-800 min-h-[200px]">
            <label class="flex items-center justify-center gap-2 text-xs text-slate-400 mb-3 cursor-pointer select-none">
                <input type="checkbox" id="share-money" class="accent-orange-500" onchange="drawShare()"><span data-i18n="share_money">圖片顯示今日已賺金額</span>
            </label>
            <div class="grid grid-cols-3 gap-2 text-xs font-bold">
                <button onclick="shareImage()" class="py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white" data-i18n="share_send">分享</button>
                <button id="sh-copy" onclick="copyImage()" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200" data-i18n="share_copy">複製</button>
                <button onclick="saveImage()" class="py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-200" data-i18n="share_save">儲存</button>
            </div>
            <p class="text-[10px] text-slate-500 mt-3" data-i18n="share_tip">微信內：長按圖片即可轉發或儲存</p>
        </div>
    </div>

    <!-- 假裝很忙 -->
    <div id="busy-overlay" onclick="busyOverlayClick()" class="fixed inset-0 z-[70] hidden flex-col bg-black">
        <div id="busy-stage" class="w-full h-full"></div>
        <div onclick="event.stopPropagation();closeBusy()" class="fixed bottom-0 right-0 p-2 text-[10px] text-slate-400/30 cursor-pointer" data-i18n="busy_exit">按 Esc 或點此返回</div>
    </div>

    <!-- 下班發射倒數 -->
    <div id="rocket-overlay" onclick="dismissRocket()" class="fixed inset-0 z-[60] hidden flex-col items-center justify-center bg-slate-950/95 text-center">
        <div class="text-lg text-orange-300 mb-2" data-i18n="rocket_title">🔥 下班發射倒數</div>
        <div id="rocket-num" class="rocket-pop text-[10rem] leading-none font-black text-orange-400 font-mono-num">10</div>
        <div class="text-7xl rocket-shake mt-4">🚀</div>
        <div class="text-xs text-slate-500 mt-8" data-i18n="rocket_hint">點擊任意處關閉</div>
    </div>

    <!-- 下班慶祝 -->
    <div id="celebration" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-40 hidden flex-col items-center justify-center p-6 text-center">
        <div class="bg-slate-900 border border-emerald-500/40 rounded-3xl p-8 max-w-sm w-full shadow-2xl glow-green relative overflow-hidden">
            <div class="text-6xl mb-3">🎉</div>
            <h2 class="text-3xl font-black text-emerald-400 mb-2" data-i18n="celeb_title">下班啦！</h2>
            <p class="text-sm text-slate-300 mb-4" data-i18n="celeb_desc">辛苦了！今日薪資已安全落袋！💰</p>
            <div class="bg-emerald-950/80 border border-emerald-500/30 rounded-2xl p-4 mb-5">
                <div class="text-xs text-emerald-400/80 mb-1" data-i18n="celeb_pocket">今日落袋金額</div>
                <div id="final-money" class="text-4xl font-extrabold text-emerald-300 font-mono-num">$0.00</div>
            </div>
            <p class="text-xs text-slate-400 mb-6" data-i18n="celeb_footer">收拾東西，火速撤離現場！🏃‍♂️💨</p>
            <button onclick="dismissCelebration()" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold rounded-xl shadow-lg transition" data-i18n="celeb_btn">
                收到，開始享受生活！ ✨
            </button>
        </div>
    </div>

<script>
    if (window.lucide) lucide.createIcons();

    // ---------- 多語言字典 ----------
    const i18nData = {
        zh: {
            title: "快樂摸魚🐟一齊吞pop",
            donate: "贊助作者",
            busy_btn: "🕶️ 假裝很忙",
            busy_title: "系統處理中，請勿關閉視窗…",
            busy_exit: "按 Esc 或點此返回",
            busy_tasks: ["正在對齊顆粒度", "正在賦能底層邏輯", "正在打通業務閉環", "正在沉澱方法論", "正在拉齊各方認知"],
            rocket_title: "🔥 下班發射倒數",
            rocket_hint: "點擊任意處關閉",
            moods: [
                [10, "☕ 靈魂尚未開機，目前由肌肉記憶接管。"],
                [30, "💻 正在假裝專注，其實在想午餐吃什麼。"],
                [50, "🍱 午餐在召喚，專注力下降 50%。"],
                [70, "😴 午後昏睡區，眼皮有自己的想法。"],
                [85, "⏳ 現在是全世界最長的一小時。"],
                [95, "🏃 全身肌肉已進入撤離姿勢。"],
                [101, "🚪 靈魂已經踏出公司大門了。"]
            ],
            status_init: "⚙️ 請先完成基本設置",
            status_before: "⏰ 距離上班還有…",
            status_off: "🎉 今日已下班！",
            status_working: "🚀 距自由還有…",
            status_rest: "😴 今天是休息日",
            hours: "小時", minutes: "分鐘", seconds: "秒",
            earned_title: "今日已賺取薪資",
            per_second: "每秒進帳",
            progress_title: "今日打工進度",
            settings_title: "⚙️ 填寫您的薪資與時間設定",
            label_currency: "貨幣選擇",
            label_calc_type: "計薪方式",
            type_monthly: "按月薪計算",
            type_daily: "按日薪計算",

    const calcTypeSelect = document.getElementById('calc-type');

    const _sl = localStorage.getItem('app_lang'), _nl = (navigator.language || '').toLowerCase();
    let currentLang = ['zh', 'cn', 'tw', 'en'].includes(_sl) ? _sl
        : _nl.startsWith('zh') ? (_nl.includes('hk') || _nl.includes('mo') ? 'zh' : (_nl.includes('tw') || _nl.includes('hant') ? 'tw' : 'cn')) : 'en';
    let statusKey = 'status_init';
    let celebrationTriggered = false;

    // ---------- 語言 ----------
    function setStatus(key) {
        statusKey = key;
        statusTitleEl.innerText = i18nData[currentLang][key];
    }

    function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('app_lang', lang);

        document.getElementById('lang-select').value = lang;
        document.documentElement.setAttribute('lang', { zh: 'zh-HK', cn: 'zh-Hans', tw: 'zh-TW', en: 'en' }[lang]);

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const text = i18nData[currentLang][el.getAttribute('data-i18n')];
            if (text) el.innerText = text;
        });
        document.querySelectorAll('[data-i18n-ph]').forEach(el => {
            const text = i18nData[currentLang][el.getAttribute('data-i18n-ph')];
            if (text) el.placeholder = text;
        });

        document.getElementById('page-title').innerText = i18nData[currentLang].title;
        document.title = i18nData[currentLang].title;
        updateTimeOptions();
        updateDate();
        setStatus(statusKey);
        updateQuote();
        lastMoodIdx = -1;
    }


    function updateQuote() {
        const quotes = i18nData[currentLang].quotes;
        quoteTextEl.innerText = quotes[Math.floor(Math.random() * quotes.length)];
    }

    function updateDate() {
        const d = new Date();
        todayDateEl.innerText = currentLang === 'en' ? d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    // ---------- 介面 ----------
    function toggleCalcType() {
        const daily = calcTypeSelect.value === 'daily';
        dailyFields.classList.toggle('hidden', !daily);
        monthlyFields.classList.toggle('hidden', daily);
    }

    function updateTimeOptions() {
        const selects = [startTimeSelect, offTimeSelect, lunchStartSelect];
        selects.forEach(select => {
            const prev = select.value || (select === lunchStartSelect ? '12:00' : '');
            select.innerHTML = `<option value="">${i18nData[currentLang].select_hint}</option>`;
            for (let h = 0; h < 24; h++) {
                for (const m of [0, 30]) {
                    const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    const opt = document.createElement('option');
                    opt.value = timeStr;
                    opt.textContent = currentLang === 'en' ? `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}` : timeStr;
                    select.appendChild(opt);
                }
            }
            select.value = prev;
        });
    }

    function toggleDonateModal(show) {
        donateModalEl.classList.toggle('hidden', !show);
        donateModalEl.classList.toggle('flex', show);
    }

    function switchDonateTab(type) {
        const btnWechat = document.getElementById('tab-wechat');
        const btnAlipay = document.getElementById('tab-alipay');
        const qrWechat = document.getElementById('qr-wechat');
        const qrAlipay = document.getElementById('qr-alipay');

        if (type === 'wechat') {
            btnWechat.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-white transition";
            btnAlipay.className = "flex-1 py-2 rounded-lg text-slate-400 transition";
            qrWechat.classList.remove('hidden');
            qrAlipay.classList.add('hidden');
        } else {
            btnAlipay.className = "flex-1 py-2 rounded-lg bg-blue-600 text-white transition";
            btnWechat.className = "flex-1 py-2 rounded-lg text-slate-400 transition";
            qrAlipay.classList.remove('hidden');
            qrWechat.classList.add('hidden');
        }
    }

    function updateCurrencySymbols() {
        const symbol = currencySelect.value;
        document.getElementById('currency-symbol').innerText = symbol;
        document.getElementById('currency-symbol-sub').innerText = symbol;
    }

    // ---------- 儲存與讀取 ----------
    function saveSettings() {
        localStorage.setItem('calc_type', calcTypeSelect.value);
        localStorage.setItem('m_salary', monthlySalaryInput.value);
        localStorage.setItem('d_salary', dailySalaryInput.value);
        localStorage.setItem('w_days', workDaysInput.value);
        localStorage.setItem('l_mins', lunchMinutesInput.value);
        localStorage.setItem('l_start', lunchStartSelect.value);
        localStorage.setItem('s_time', startTimeSelect.value);
        localStorage.setItem('o_time', offTimeSelect.value);
        localStorage.setItem('c_symbol', currencySelect.value);
        localStorage.setItem('weekend_rest', weekendRestCheck.checked ? '1' : '0');
    }

    function loadSettings() {
        const get = k => localStorage.getItem(k);
        if (get('calc_type')) calcTypeSelect.value = get('calc_type');
        toggleCalcType();

        if (get('m_salary')) monthlySalaryInput.value = get('m_salary');
        if (get('d_salary')) dailySalaryInput.value = get('d_salary');
        if (get('w_days')) workDaysInput.value = get('w_days');
        if (get('l_mins')) lunchMinutesInput.value = get('l_mins');
        if (get('l_start')) lunchStartSelect.value = get('l_start');
        if (get('s_time')) startTimeSelect.value = get('s_time');
        if (get('o_time')) offTimeSelect.value = get('o_time');
        if (get('c_symbol')) currencySelect.value = get('c_symbol');
        weekendRestCheck.checked = get('weekend_rest') === '1';

        updateCurrencySymbols();

        const monthly = calcTypeSelect.value === 'monthly';
        const salaryValid = monthly
            ? (parseFloat(monthlySalaryInput.value) > 0 && parseFloat(workDaysInput.value) > 0)
            : (parseFloat(dailySalaryInput.value) > 0);

        if (salaryValid && startTimeSelect.value && offTimeSelect.value && lunchMinutesInput.value !== '') {
            settingsDetails.removeAttribute('open');
            startCounting();
        } else {
            settingsDetails.setAttribute('open', '');
            setStatus('status_init');
        }
    }

    // ---------- 開始計時 ----------
    function startCounting() {
        const type = calcTypeSelect.value;
        const mSalary = parseFloat(monthlySalaryInput.value);
        const dSalary = parseFloat(dailySalaryInput.value);
        const days = parseFloat(workDaysInput.value);
        const lunch = lunchMinutesInput.value !== '' ? parseFloat(lunchMinutesInput.value) : null;
        const t = i18nData[currentLang];

        const fail = (msg, el) => {
            alert(msg);
            settingsDetails.setAttribute('open', '');
            el.focus();
        };

        if (type === 'monthly') {
            if (!mSalary || mSalary <= 0) return fail(t.alert_salary, monthlySalaryInput);
            if (!days || days <= 0) return fail(t.alert_days, workDaysInput);
        } else if (!dSalary || dSalary <= 0) {
            return fail(t.alert_daily_salary, dailySalaryInput);
        }
        if (lunch === null || isNaN(lunch) || lunch < 0) return fail(t.alert_lunch, lunchMinutesInput);
        if (!startTimeSelect.value) return fail(t.alert_start, startTimeSelect);
        if (!offTimeSelect.value) return fail(t.alert_off, offTimeSelect);

        saveSettings();
        updateCurrencySymbols();
        celebrationTriggered = false;
        settingsDetails.removeAttribute('open');

        updateTimer();
        if (!timerInterval) timerInterval = setInterval(updateTimer, 1000);
    }

    // ---------- 計算 ----------
    // 兩個時間區間的重疊毫秒數
    function overlap(aS, aE, bS, bE) {
        return Math.max(0, Math.min(aE, bE) - Math.max(aS, bS));
    }

    function hideCelebration() {
        celebrationEl.classList.add('hidden');
        celebrationEl.classList.remove('flex');
        hideRocket();
    }

    function setClock(h, m, s) {
        document.getElementById('hours').innerText = h;
        document.getElementById('minutes').innerText = m;
        document.getElementById('seconds').innerText = s;
    }

    function setProgress(percent) {
        document.getElementById('progress-fill').style.width = percent + '%';
        document.getElementById('progress-percent').innerText = percent + '%';
    }

    function updateDisplayTime(ms) {
        const hours = Math.floor(ms / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        setClock(String(hours).padStart(2, '0'), String(minutes).padStart(2, '0'), String(seconds).padStart(2, '0'));
    }

    function updateTimer() {
        updateDate();

        const type = calcTypeSelect.value;
        const mSalary = parseFloat(monthlySalaryInput.value) || 0;
        const dSalary = parseFloat(dailySalaryInput.value) || 0;
        const workDays = parseFloat(workDaysInput.value) || 0;
        const sTime = startTimeSelect.value;
        const oTime = offTimeSelect.value;

        const salaryValid = (type === 'monthly') ? (mSalary > 0 && workDays > 0) : (dSalary > 0);
        if (!salaryValid || !sTime || !oTime) return;

        const currentTime = new Date();
        const lunchMins = parseFloat(lunchMinutesInput.value) || 0;
        const symbol = currencySelect.value;
        updateCurrencySymbols();

        // 週末休息
        const dow = currentTime.getDay();
        if (weekendRestCheck.checked && (dow === 0 || dow === 6)) {
            setStatus('status_rest');
            hideCelebration();
            setClock('--', '--', '--');
            document.getElementById('earned-money').innerText = '0.00';
            document.getElementById('per-second').innerText = '0.0000';
            setProgress(0);
            return;
        }

        const [startHour, startMinute] = sTime.split(':').map(Number);
        const [targetHour, targetMinute] = oTime.split(':').map(Number);

        let startTime = new Date(currentTime.getFullYear(), currentTime.getMonth(), currentTime.getDate(), startHour, startMinute, 0, 0);
        let targetTime = new Date(currentTime.getFullYear(), currentTime.getMonth(), currentTime.getDate(), targetHour, targetMinute, 0, 0);

        // 跨天班
        if (targetTime <= startTime) {
            if (currentTime >= startTime) {
                targetTime.setDate(targetTime.getDate() + 1);
            } else {
                startTime.setDate(startTime.getDate() - 1);
            }
        }

        const dailySalary = (type === 'monthly') ? (mSalary / workDays) : dSalary;

        // 午休放在真實的時間點
        const [lh, lm] = (lunchStartSelect.value || '12:00').split(':').map(Number);
        const lunchStart = new Date(startTime);
        lunchStart.setHours(lh, lm, 0, 0);
        if (lunchStart < startTime) lunchStart.setDate(lunchStart.getDate() + 1);
        const lunchEnd = new Date(lunchStart.getTime() + lunchMins * 60000);

        const lunchTotalMs = overlap(lunchStart, lunchEnd, startTime, targetTime);
        const totalWorkSec = Math.max(1, (targetTime - startTime - lunchTotalMs) / 1000);
        const perSecondSalary = dailySalary / totalWorkSec;

        document.getElementById('per-second').innerText = perSecondSalary.toFixed(4);

        // 1. 還沒上班
        if (currentTime < startTime) {
            hideCelebration();
            celebrationTriggered = false;
            setStatus('status_before');
            updateDisplayTime(startTime - currentTime);
            document.getElementById('earned-money').innerText = '0.00';
            setProgress(0);
            return;
        }

        // 2. 已下班
        if (currentTime >= targetTime) {
            setStatus('status_off');
            hideRocket();
            if (!celebrationTriggered) {
                celebrationTriggered = true;
                const key = 'celebrated_' + new Date().toDateString();
                if (!localStorage.getItem(key)) {
                    document.getElementById('final-money').innerText = `${symbol}${dailySalary.toFixed(2)}`;
                    celebrationEl.classList.remove('hidden');
                    celebrationEl.classList.add('flex');
                    triggerConfetti();
                    localStorage.setItem(key, '1');
                }
            }
            setClock('00', '00', '00');
            setProgress(100);
            document.getElementById('earned-money').innerText = dailySalary.toFixed(2);
            document.getElementById('final-money').innerText = `${symbol}${dailySalary.toFixed(2)}`;
            return;
        }

        // 3. 上班中
        setStatus('status_working');
        hideCelebration();
        celebrationTriggered = false;

        const lunchElapsedMs = overlap(lunchStart, lunchEnd, startTime, currentTime);
        const elapsedWorkSec = Math.max(0, (currentTime - startTime - lunchElapsedMs) / 1000);

        const currentEarned = Math.min(dailySalary, elapsedWorkSec * perSecondSalary);
        document.getElementById('earned-money').innerText = currentEarned.toFixed(2);

        updateDisplayTime(targetTime - currentTime);

        const percent = Math.min(100, Math.floor((elapsedWorkSec / totalWorkSec) * 100));
        setProgress(percent);

        updateMood(percent);
        updateRocket(targetTime - currentTime);
    }

    function beep(freq, dur) {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.value = 0.08;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        } catch (e) { /* 瀏覽器不允許自動播放時就靜音 */ }

        (scenes[scene] || sceneUpdate)(stage);
        const touch = window.matchMedia && matchMedia('(pointer:coarse)').matches;
        if (scene === 'mail') hintStart(touch ? tr('👆 點擊畫面，郵件會自動寫出嚟', '👆 点击屏幕，邮件会自动写出来', '👆 Tap the screen — the email writes itself') : tr('⌨️ 用鍵盤隨便打字，郵件會自動寫出嚟', '⌨️ 随便敲键盘，邮件会自动写出来', '⌨️ Just type on your keyboard — the email writes itself', '⌨️ 隨便敲鍵盤，郵件就會自動寫出來'));
        if (scene === 'excel') hintStart(touch ? tr('👆 點擊儲存格選取，再用鍵盤打字', '👆 点击单元格选取，再用键盘输入', '👆 Tap a cell, then type') : tr('⌨️ 用鍵盤打字填格，方向鍵 / Enter / Tab 移動', '⌨️ 敲键盘填格，方向键 / Enter / Tab 移动', '⌨️ Type to fill cells · Arrows / Enter / Tab to move'));
        busyEl.classList.remove('hidden');
        busyEl.classList.add('flex');
        try { busyEl.requestFullscreen && busyEl.requestFullscreen().catch(() => {}); } catch (e) {}
    }

    function closeBusy() {
        busyClear();
        busyEl.classList.add('hidden');
        busyEl.classList.remove('flex');
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    }

    document.addEventListener('keydown', e => {
        if (busyEl.classList.contains('hidden')) return;
        if (e.key === 'Escape') { closeBusy(); return; }
        if (!busyKeyHandler || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key.length === 1 || ['Enter', 'Backspace', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
            busyKeyHandler(e);
            hintTyped();
        }
    });
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && !busyEl.classList.contains('hidden')) closeBusy();
    });

    // ---------- 分享圖片 ----------
    const shareEl = document.getElementById('share-modal');
    let shareBlob = null;
    function toggleShare(show) {
        shareEl.classList.toggle('hidden', !show);
        shareEl.classList.toggle('flex', show);
    }
    async function openShare() { toggleShare(true); await drawShare(); }
    async function drawShare() {
        try { await document.fonts.ready; } catch (e) {}
        const W = 1080, H = 1350, c = document.createElement('canvas');
        c.width = W; c.height = H;
        const g = c.getContext('2d'), t = i18nData[currentLang], $ = id => document.getElementById(id);
        const sans = "'Noto Sans TC','PingFang SC','Microsoft YaHei',sans-serif", mono = "'JetBrains Mono',monospace";
        const bg = g.createLinearGradient(0, 0, W, H);
        bg.addColorStop(0, '#0f172a'); bg.addColorStop(1, '#1e293b');
        g.fillStyle = bg; g.fillRect(0, 0, W, H);
        [[0, 0, 'rgba(249,115,22,.3)'], [W, H, 'rgba(16,185,129,.26)']].forEach(([x, y, col]) => {
            const r = g.createRadialGradient(x, y, 0, x, y, 640);
            r.addColorStop(0, col); r.addColorStop(1, 'rgba(0,0,0,0)');
            g.fillStyle = r; g.fillRect(0, 0, W, H);
        });
        g.textAlign = 'center';
        const txt = (s, y, size, color, font = sans, w = '700') => { g.font = `${w} ${size}px ${font}`; g.fillStyle = color; g.fillText(s, W / 2, y); };
        txt(t.title, 120, 46, '#fdba74');
        txt($('today-date').innerText, 175, 30, '#94a3b8');
        const pct = parseInt($('progress-percent').innerText) || 0, cx = W / 2, cy = 520, R = 235;
        g.lineWidth = 44; g.lineCap = 'round'; g.strokeStyle = '#273449';
        g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
        if (pct > 0) {
            const ag = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
            ag.addColorStop(0, '#f97316'); ag.addColorStop(1, '#facc15');
            g.strokeStyle = ag; g.beginPath(); g.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct / 100); g.stroke();
        }
        txt(pct + '%', cy + 45, 140, '#fb923c', mono, '800');
        txt(t.progress_title, cy + 115, 34, '#cbd5e1');
        txt(statusTitleEl.innerText, 880, 54, '#fbbf24', sans, '900');
        txt(`${$('hours').innerText}:${$('minutes').innerText}:${$('seconds').innerText}`, 1015, 110, '#fde68a', mono, '800');
        let y = 1090;
        if ($('share-money').checked) { txt($('currency-symbol').innerText.trim() + $('earned-money').innerText, 1090, 56, '#34d399', mono, '800'); y = 1160; }
        const quote = quoteTextEl.innerText;
        g.font = `500 32px ${sans}`; g.fillStyle = '#fcd34d';
        const words = currentLang === 'en' ? quote.split(' ').map(w => w + ' ') : [...quote], lines = [];
        let line = '';
        words.forEach(w => { if (g.measureText(line + w).width > W - 220) { lines.push(line); line = w; } else line += w; });
        lines.push(line);
        lines.slice(0, 3).forEach((l, i) => g.fillText(l.trim(), W / 2, y + i * 48));
        txt(t.share_foot, 1305, 30, '#64748b', sans, '500');
        $('share-img').src = c.toDataURL('image/png');
        c.toBlob(b => { shareBlob = b; }, 'image/png');
    }
    function saveImage() {
        if (!shareBlob) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(shareBlob); a.download = 'moyu-progress.png'; a.click();
    }
    async function shareImage() {
        if (!shareBlob) return;
        const file = new File([shareBlob], 'moyu-progress.png', { type: 'image/png' });
        try {
            if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: i18nData[currentLang].title }); return; }
        } catch (e) { if (e.name === 'AbortError') return; }
        saveImage();
    }
    async function copyImage() {
        const btn = document.getElementById('sh-copy'), old = btn.innerText;
        try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': shareBlob })]); btn.innerText = '✓'; }
        catch (e) { btn.innerText = '↓'; saveImage(); }
        setTimeout(() => { btn.innerText = old; }, 1200);
    }

    // ---------- 初始化 ----------
    updateDate();
    setLanguage(currentLang);
    loadSettings();
</script>
</body>
</html>
