<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸魚計時器 & 薪水計算器 v2.1</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .input-group input, .input-group select {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            margin-top: 5px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .money-display {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .money-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .money-amount {
            font-size: 2.8rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            background: var(--bg-color);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            background: var(--accent-gradient);
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* 日曆統計模組 */
        .calendar-card {
            margin-top: 5px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-weekday {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding-bottom: 5px;
        }

        .calendar-day {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 2px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-height: 50px;
        }

        .calendar-day.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.05);
        }

        .calendar-day.today {
            border-color: var(--success-color);
            font-weight: bold;
        }

        .calendar-day span {
            font-size: 0.65rem;
            color: var(--success-color);
        }

        /* 贊助 Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .qr-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .qr-item img {
            width: 110px;
            height: 110px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .qr-item p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- 頂部導覽 -->
        <header>
            <h1 id="t-title">💼 摸魚計時器 v2.1</h1>
            <div class="btn-group">
                <button onclick="toggleLang()" id="langBtn">简 / 繁</button>
                <button onclick="toggleTheme()">☀️ / 🌙</button>
                <button onclick="openModal()" id="t-sponsorBtn">☕ 贊助作者</button>
            </div>
        </header>

        <!-- 設定面板 -->
        <div class="card">
            <div class="settings-grid">
                <div class="input-group">
                    <label id="t-modeLabel">計算模式</label>
                    <select id="salaryType" onchange="toggleSalaryType()">
                        <option value="monthly" id="t-optMonthly">月薪制</option>
                        <option value="daily" id="t-optDaily">日薪制</option>
                    </select>
                </div>
                <div class="input-group" id="salaryInputGroup">
                    <label id="salaryLabel">每月底薪 (元)</label>
                    <input type="number" id="salaryInput" value="18000" oninput="saveSettings()">
                </div>
                <div class="input-group">
                    <label id="t-startLabel">上班時間</label>
                    <input type="time" id="startTime" value="09:00" onchange="saveSettings()">
                </div>
                <div class="input-group">
                    <label id="t-endLabel">下班時間</label>
                    <input type="time" id="endTime" value="18:00" onchange="saveSettings()">
                </div>
            </div>
            
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
                <label class="checkbox-group">
                    <input type="checkbox" id="isOffDay" onchange="saveSettings()"> <span id="t-offDayLabel">今天放假/休息（不計薪）</span>
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="allowOvertime" onchange="saveSettings()"> <span id="t-overtimeLabel">允許加班計薪（超過下班時間繼續計算）</span>
                </label>
            </div>
        </div>

        <!-- 薪水與進度主面板 -->
        <div class="card">
            <div class="money-display">
                <div class="money-title" id="t-moneyTitle">今日已入帳薪資</div>
                <div class="money-amount" id="earnedMoney">￥0.00</div>
            </div>

            <div class="progress-section">
                <div class="progress-row">
                    <span id="t-progressLabel">上班進度</span>
                    <span id="timePercent">0.0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="timeProgressBar"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label" id="t-remainingLabel">剩餘工作時間</div>
                        <div class="stat-value" id="remainingTime">--:--:--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label" id="t-levelLabel">今日摸魚評級</div>
                        <div class="stat-value" id="moyuLevel">🚀 高效運轉</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日曆模式統計 -->
        <div class="card calendar-card">
            <div class="calendar-header">
                <h3 style="font-size: 1rem;" id="calendarTitle">本月收入統計</h3>
                <div class="btn-group">
                    <button onclick="changeMonth(-1)">◀</button>
                    <button onclick="resetMonth()" id="t-currentMonthBtn">本月</button>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- 動態生成日曆 -->
            </div>
        </div>

        <footer>
            <p id="t-footer">Made with ❤️ for 摸魚人 | <a href="#" onclick="openModal()">支持作者</a></p>
        </footer>
    </div>

    <!-- 贊助 Modal -->
    <div class="modal" id="sponsorModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="t-modalTitle">贊助一杯咖啡 ☕</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;" id="t-modalDesc">如果這個工具對你有幫助，歡迎贊助支持！</p>
            <div class="qr-images">
                <div class="qr-item">
                    <img src="wechat-qr.png" alt="微信收款碼">
                    <p id="t-wechatText">微信支付</p>
                </div>
                <div class="qr-item">
                    <img src="alipay-qr.png" alt="支付寶收款碼">
                    <p id="t-alipayText">支付寶</p>
                </div>
            </div>
            <button onclick="closeModal()" style="width: 100%; margin-top: 10px;" id="t-closeBtn">關閉窗口</button>
        </div>
    </div>

    <script>
        // 語系詞典設定 ('hant' = 繁體, 'hans' = 簡體)
        let currentLang = localStorage.getItem('moyu_lang') || 'hant';

        const i18n = {
            hant: {
                title: "💼 摸魚計時器 v2.1",
                sponsorBtn: "☕ 贊助作者",
                modeLabel: "計算模式",
                optMonthly: "月薪制",
                optDaily: "日薪制",
                monthlyLabel: "每月底薪 (元)",
                dailyLabel: "每日日薪 (元)",
                startLabel: "上班時間",
                endLabel: "下班時間",
                offDayLabel: "今天放假/休息（不計薪）",
                overtimeLabel: "允許加班計薪（超過下班時間繼續計算）",
                moneyTitle: "今日已入帳薪資",
                progressLabel: "上班進度",
                remainingLabel: "剩餘工作時間",
                levelLabel: "今日摸魚評級",
                currentMonthBtn: "本月",
                footer: 'Made with ❤️ for 摸魚人 | <a href="#" onclick="openModal()">支持作者</a>',
                modalTitle: "贊助一杯咖啡 ☕",
                modalDesc: "如果這個工具對你有幫助，歡迎贊助支持！",
                wechatText: "微信支付",
                alipayText: "支付寶",
                closeBtn: "關閉窗口",
                offDayText: "今日放假",
                restText: "今日休息",
                notStarted: "⏳ 尚未上班",
                overtimeWork: "加班中 (+1.5x)",
                offWork: "今日已下班",
                successOff: "勝利下班",
                weekdays: ['日', '一', '二', '三', '四', '五', '六'],
                levels: ['🍵 帶薪拉屎中', '👀 深度摸魚', '☕ 思考人生', '💻 象徵性辦公', '⚡ 衝刺下班', '🔥 燃燒靈魂', '🌴 享受假期', '🚀 高效運轉']
            },
            hans: {
                title: "💼 摸鱼计时器 v2.1",
                sponsorBtn: "☕ 赞助作者",
                modeLabel: "计算模式",
                optMonthly: "月薪制",
                optDaily: "日薪制",
                monthlyLabel: "每月底薪 (元)",
                dailyLabel: "每日日薪 (元)",
                startLabel: "上班时间",
                endLabel: "下班时间",
                offDayLabel: "今天放假/休息（不计薪）",
                overtimeLabel: "允许加班计薪（超过下班时间继续计算）",
                moneyTitle: "今日已入账薪资",
                progressLabel: "上班进度",
                remainingLabel: "剩余工作时间",
                levelLabel: "今日摸鱼评级",
                currentMonthBtn: "本月",
                footer: 'Made with ❤️ for 摸鱼人 | <a href="#" onclick="openModal()">支持作者</a>',
                modalTitle: "赞助一杯咖啡 ☕",
                modalDesc: "如果这个工具对你有帮助，欢迎赞助支持！",
                wechatText: "微信支付",
                alipayText: "支付宝",
                closeBtn: "关闭窗口",
                offDayText: "今日放假",
                restText: "今日休息",
                notStarted: "⏳ 尚未上班",
                overtimeWork: "加班中 (+1.5x)",
                offWork: "今日已下班",
                successOff: "胜利下班",
                weekdays: ['日', '一', '二', '三', '四', '五', '六'],
                levels: ['🍵 带薪拉屎中', '👀 深度摸鱼', '☕ 思考人生', '💻 象征性办公', '⚡ 冲刺下班', '🔥 燃烧灵魂', '🌴 享受假期', '🚀 高效运转']
            }
        };

        function toggleLang() {
            currentLang = currentLang === 'hant' ? 'hans' : 'hant';
            localStorage.setItem('moyu_lang', currentLang);
            updateText();
            calculateSalary();
        }

        function updateText() {
            const t = i18n[currentLang];
            document.getElementById('t-title').innerText = t.title;
            document.getElementById('t-sponsorBtn').innerText = t.sponsorBtn;
            document.getElementById('t-modeLabel').innerText = t.modeLabel;
            document.getElementById('t-optMonthly').innerText = t.optMonthly;
            document.getElementById('t-optDaily').innerText = t.optDaily;
            document.getElementById('t-startLabel').innerText = t.startLabel;
            document.getElementById('t-endLabel').innerText = t.endLabel;
            document.getElementById('t-offDayLabel').innerText = t.offDayLabel;
            document.getElementById('t-overtimeLabel').innerText = t.overtimeLabel;
            document.getElementById('t-moneyTitle').innerText = t.moneyTitle;
            document.getElementById('t-progressLabel').innerText = t.progressLabel;
            document.getElementById('t-remainingLabel').innerText = t.remainingLabel;
            document.getElementById('t-levelLabel').innerText = t.levelLabel;
            document.getElementById('t-currentMonthBtn').innerText = t.currentMonthBtn;
            document.getElementById('t-footer').innerHTML = t.footer;
            document.getElementById('t-modalTitle').innerText = t.modalTitle;
            document.getElementById('t-modalDesc').innerText = t.modalDesc;
            document.getElementById('t-wechatText').innerText = t.wechatText;
            document.getElementById('t-alipayText').innerText = t.alipayText;
            document.getElementById('t-closeBtn').innerText = t.closeBtn;
            document.getElementById('langBtn').innerText = currentLang === 'hant' ? '简' : '繁';
            
            toggleSalaryType();
            renderCalendar();
        }

        // 初始化與讀取設定
        let settings = JSON.parse(localStorage.getItem('moyu_settings')) || {
            salaryType: 'monthly',
            salary: 18000,
            startTime: '09:00',
            endTime: '18:00',
            isOffDay: false,
            allowOvertime: true
        };

        let earningsHistory = JSON.parse(localStorage.getItem('moyu_earnings_history')) || {};
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        function initForm() {
            document.getElementById('salaryType').value = settings.salaryType;
            document.getElementById('salaryInput').value = settings.salary;
            document.getElementById('startTime').value = settings.startTime;
            document.getElementById('endTime').value = settings.endTime;
            document.getElementById('isOffDay').checked = settings.isOffDay;
            document.getElementById('allowOvertime').checked = settings.allowOvertime;
            updateText();
        }

        function toggleSalaryType() {
            const type = document.getElementById('salaryType').value;
            const label = document.getElementById('salaryLabel');
            const t = i18n[currentLang];
            if (type === 'monthly') {
                label.innerText = t.monthlyLabel;
            } else {
                label.innerText = t.dailyLabel;
            }
            saveSettings();
        }

        function saveSettings() {
            settings.salaryType = document.getElementById('salaryType').value;
            settings.salary = parseFloat(document.getElementById('salaryInput').value) || 0;
            settings.startTime = document.getElementById('startTime').value;
            settings.endTime = document.getElementById('endTime').value;
            settings.isOffDay = document.getElementById('isOffDay').checked;
            settings.allowOvertime = document.getElementById('allowOvertime').checked;
            localStorage.setItem('moyu_settings', JSON.stringify(settings));
        }

        function calculateSalary() {
            saveSettings();
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const t = i18n[currentLang];

            if (settings.isOffDay) {
                document.getElementById('earnedMoney').innerText = `￥0.00 (${t.offDayText})`;
                document.getElementById('timePercent').innerText = '0.0%';
                document.getElementById('timeProgressBar').style.width = '0%';
                document.getElementById('remainingTime').innerText = t.restText;
                document.getElementById('moyuLevel').innerText = currentLang === 'hant' ? '🌴 享受假期' : '🌴 享受假期';
                return;
            }

            const [startH, startM] = settings.startTime.split(':').map(Number);
            const [endH, endM] = settings.endTime.split(':').map(Number);

            const startTimeSec = startH * 3600 + startM * 60;
            const endTimeSec = endH * 3600 + endM * 60;
            const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            const totalWorkSec = endTimeSec - startTimeSec;
            if (totalWorkSec <= 0) {
                document.getElementById('remainingTime').innerText = '時間設定錯誤';
                return;
            }

            let dailyTotalSalary = settings.salaryType === 'monthly' ? settings.salary / 21.75 : settings.salary;
            let perSecondSalary = dailyTotalSalary / totalWorkSec;

            let earned = 0;
            let percent = 0;

            if (nowSec < startTimeSec) {
                earned = 0;
                percent = 0;
                document.getElementById('remainingTime').innerText = formatTime(startTimeSec - nowSec);
                document.getElementById('moyuLevel').innerText = t.notStarted;
            } else if (nowSec >= startTimeSec && nowSec <= endTimeSec) {
                let workedSec = nowSec - startTimeSec;
                earned = workedSec * perSecondSalary;
                percent = (workedSec / totalWorkSec) * 100;
                document.getElementById('remainingTime').innerText = formatTime(endTimeSec - nowSec);
                document.getElementById('moyuLevel').innerText = getMoyuLevel(percent);
            } else {
                if (settings.allowOvertime) {
                    let overtimeSec = nowSec - endTimeSec;
                    let overtimeEarned = overtimeSec * (perSecondSalary * 1.5);
                    earned = dailyTotalSalary + overtimeEarned;
                    percent = 100;
                    document.getElementById('remainingTime').innerText = t.overtimeWork;
                    document.getElementById('moyuLevel').innerText = currentLang === 'hant' ? '🔥 燃燒靈魂' : '🔥 燃烧灵魂';
                } else {
                    earned = dailyTotalSalary;
                    percent = 100;
                    document.getElementById('remainingTime').innerText = t.offWork;
                    document.getElementById('moyuLevel').innerText = t.successOff;
                }
            }

            document.getElementById('earnedMoney').innerText = `￥${earned.toFixed(2)}`;
            document.getElementById('timePercent').innerText = `${percent.toFixed(1)}%`;
            document.getElementById('timeProgressBar').style.width = `${Math.min(percent, 100)}%`;

            earningsHistory[todayStr] = parseFloat(earned.toFixed(2));
            localStorage.setItem('moyu_earnings_history', JSON.stringify(earningsHistory));

            renderCalendar();
        }

        function formatTime(sec) {
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function getMoyuLevel(percent) {
            const levels = i18n[currentLang].levels;
            if (percent < 20) return levels[0];
            if (percent < 40) return levels[1];
            if (percent < 60) return levels[2];
            if (percent < 80) return levels[3];
            return levels[4];
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('calendarTitle');
            const t = i18n[currentLang];
            grid.innerHTML = '';

            title.innerText = currentLang === 'hant' ? `${currentYear}年${currentMonth + 1}月收入統計` : `${currentYear}年${currentMonth + 1}月收入统计`;

            t.weekdays.forEach(w => {
                const div = document.createElement('div');
                div.className = 'calendar-weekday';
                div.innerText = w;
                grid.appendChild(div);
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const today = new Date();

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                grid.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEarned = earningsHistory[dateStr] || 0;

                const dayDiv = document.createElement('div');
                dayDiv.className = 'calendar-day';
                
                const isToday = today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === day;
                if (isToday) dayDiv.classList.add('today');
                if (dayEarned > 0) dayDiv.classList.add('active');

                dayDiv.innerHTML = `
                    <strong>${day}</strong>
                    <span>${dayEarned > 0 ? '￥' + Math.round(dayEarned) : ''}</span>
                `;
                grid.appendChild(dayDiv);
            }
        }

        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function resetMonth() {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderCalendar();
        }

        function toggleTheme() {
            const body = document.body;
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
            }
        }

        function openModal() {
            document.getElementById('sponsorModal').style.display = 'flex';
        }
        function closeModal(event) {
            if (!event || event.target.id === 'sponsorModal' || event.target.tagName === 'BUTTON') {
                document.getElementById('sponsorModal').style.display = 'none';
            }
        }

        initForm();
        setInterval(calculateSalary, 1000);
        calculateSalary();
    </script>
</body>
</html>
