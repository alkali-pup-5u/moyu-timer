<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摸魚計時器 & 薪水計算器 v2.0</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --accent-color: #0284c7;
            --accent-gradient: linear-gradient(135deg, #0284c7 0%, #4f46e5 100%);
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
        }

        button:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .input-group input, .input-group select {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            margin-top: 5px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .money-display {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .money-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .money-amount {
            font-size: 2.8rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            background: var(--bg-color);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            background: var(--accent-gradient);
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* 日曆統計模組 */
        .calendar-card {
            margin-top: 5px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .calendar-weekday {
            font-size: 0.75rem;
            color: var(--text-secondary);
            padding-bottom: 5px;
        }

        .calendar-day {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 2px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-height: 50px;
        }

        .calendar-day.active {
            border-color: var(--accent-color);
            background: rgba(56, 189, 248, 0.05);
        }

        .calendar-day.today {
            border-color: var(--success-color);
            font-weight: bold;
        }

        .calendar-day span {
            font-size: 0.65rem;
            color: var(--success-color);
        }

        /* 贊助 Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .qr-images {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }

        .qr-item img {
            width: 110px;
            height: 110px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .qr-item p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <!-- 頂部導覽 -->
        <header>
            <h1>💼 摸魚計時器 v2.0</h1>
            <div class="btn-group">
                <button onclick="toggleTheme()">☀️ / 🌙</button>
                <button onclick="openModal()">☕ 贊助作者</button>
            </div>
        </header>

        <!-- 設定面板 -->
        <div class="card">
            <div class="settings-grid">
                <div class="input-group">
                    <label>計算模式</label>
                    <select id="salaryType" onchange="toggleSalaryType()">
                        <option value="monthly">月薪制</option>
                        <option value="daily">日薪制</option>
                    </select>
                </div>
                <div class="input-group" id="salaryInputGroup">
                    <label id="salaryLabel">每月底薪 (元)</label>
                    <input type="number" id="salaryInput" value="18000" oninput="saveSettings()">
                </div>
                <div class="input-group">
                    <label>上班時間</label>
                    <input type="time" id="startTime" value="09:00" onchange="saveSettings()">
                </div>
                <div class="input-group">
                    <label>下班時間</label>
                    <input type="time" id="endTime" value="18:00" onchange="saveSettings()">
                </div>
            </div>
            
            <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
                <label class="checkbox-group">
                    <input type="checkbox" id="isOffDay" onchange="saveSettings()"> 今天放假/休息（不計薪）
                </label>
                <label class="checkbox-group">
                    <input type="checkbox" id="allowOvertime" onchange="saveSettings()"> 允許加班計薪（超過下班時間繼續計算）
                </label>
            </div>
        </div>

        <!-- 薪水與進度主面板 -->
        <div class="card">
            <div class="money-display">
                <div class="money-title">今日已入帳薪資</div>
                <div class="money-amount" id="earnedMoney">￥0.00</div>
            </div>

            <div class="progress-section">
                <div class="progress-row">
                    <span>上班進度</span>
                    <span id="timePercent">0.0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="timeProgressBar"></div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">剩餘工作時間</div>
                        <div class="stat-value" id="remainingTime">--:--:--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">今日摸魚評級</div>
                        <div class="stat-value" id="moyuLevel">🚀 高效運轉</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 日曆模式統計 -->
        <div class="card calendar-card">
            <div class="calendar-header">
                <h3 style="font-size: 1rem;" id="calendarTitle">本月收入統計</h3>
                <div class="btn-group">
                    <button onclick="changeMonth(-1)">◀</button>
                    <button onclick="resetMonth()">本月</button>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- 動態生成日曆 -->
            </div>
        </div>

        <footer>
            <p>Made with ❤️ for 摸魚人 | <a href="#" onclick="openModal()">支持作者</a></p>
        </footer>
    </div>

    <!-- 贊助 Modal -->
    <div class="modal" id="sponsorModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3>贊助一杯咖啡 ☕</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">如果這個工具對你有幫助，歡迎贊助支持！</p>
            <div class="qr-images">
                <div class="qr-item">
                    <img src="wechat-qr.png" alt="微信收款碼">
                    <p>微信支付</p>
                </div>
                <div class="qr-item">
                    <img src="alipay-qr.png" alt="支付寶收款碼">
                    <p>支付寶</p>
                </div>
            </div>
            <button onclick="closeModal()" style="width: 100%; margin-top: 10px;">關閉窗口</button>
        </div>
    </div>

    <script>
        // 初始化與讀取設定
        let settings = JSON.parse(localStorage.getItem('moyu_settings')) || {
            salaryType: 'monthly',
            salary: 18000,
            startTime: '09:00',
            endTime: '18:00',
            isOffDay: false,
            allowOvertime: true
        };

        // 本月各日已賺取金額記錄 (格式: { '2026-11-04': 520.5 })
        let earningsHistory = JSON.parse(localStorage.getItem('moyu_earnings_history')) || {};
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0-11

        function initForm() {
            document.getElementById('salaryType').value = settings.salaryType;
            document.getElementById('salaryInput').value = settings.salary;
            document.getElementById('startTime').value = settings.startTime;
            document.getElementById('endTime').value = settings.endTime;
            document.getElementById('isOffDay').checked = settings.isOffDay;
            document.getElementById('allowOvertime').checked = settings.allowOvertime;
            toggleSalaryType();
        }

        function toggleSalaryType() {
            const type = document.getElementById('salaryType').value;
            const label = document.getElementById('salaryLabel');
            if (type === 'monthly') {
                label.innerText = '每月底薪 (元)';
            } else {
                label.innerText = '每日日薪 (元)';
            }
            saveSettings();
        }

        function saveSettings() {
            settings.salaryType = document.getElementById('salaryType').value;
            settings.salary = parseFloat(document.getElementById('salaryInput').value) || 0;
            settings.startTime = document.getElementById('startTime').value;
            settings.endTime = document.getElementById('endTime').value;
            settings.isOffDay = document.getElementById('isOffDay').checked;
            settings.allowOvertime = document.getElementById('allowOvertime').checked;
            localStorage.setItem('moyu_settings', JSON.stringify(settings));
        }

        function calculateSalary() {
            saveSettings();
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            if (settings.isOffDay) {
                document.getElementById('earnedMoney').innerText = '￥0.00 (今日放假)';
                document.getElementById('timePercent').innerText = '0.0%';
                document.getElementById('timeProgressBar').style.width = '0%';
                document.getElementById('remainingTime').innerText = '今日休息';
                document.getElementById('moyuLevel').innerText = '🌴 享受假期';
                return;
            }

            const [startH, startM] = settings.startTime.split(':').map(Number);
            const [endH, endM] = settings.endTime.split(':').map(Number);

            const startTimeSec = startH * 3600 + startM * 60;
            const endTimeSec = endH * 3600 + endM * 60;
            const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

            const totalWorkSec = endTimeSec - startTimeSec;
            if (totalWorkSec <= 0) {
                document.getElementById('remainingTime').innerText = '時間設定錯誤';
                return;
            }

            // 計算日薪總額
            let dailyTotalSalary = settings.salaryType === 'monthly' ? settings.salary / 21.75 : settings.salary;
            let perSecondSalary = dailyTotalSalary / totalWorkSec;

            let earned = 0;
            let percent = 0;

            if (nowSec < startTimeSec) {
                earned = 0;
                percent = 0;
                document.getElementById('remainingTime').innerText = formatTime(startTimeSec - nowSec);
                document.getElementById('moyuLevel').innerText = '⏳ 尚未上班';
            } else if (nowSec >= startTimeSec && nowSec <= endTimeSec) {
                let workedSec = nowSec - startTimeSec;
                earned = workedSec * perSecondSalary;
                percent = (workedSec / totalWorkSec) * 100;
                document.getElementById('remainingTime').innerText = formatTime(endTimeSec - nowSec);
                document.getElementById('moyuLevel').innerText = getMoyuLevel(percent);
            } else {
                // 已過下班時間
                if (settings.allowOvertime) {
                    let overtimeSec = nowSec - endTimeSec;
                    let overtimeEarned = overtimeSec * (perSecondSalary * 1.5); // 加班 1.5 倍
                    earned = dailyTotalSalary + overtimeEarned;
